<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17100A">
  <title>Choose Your Language | اختر لغتك</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; overflow-x: hidden;
      background: #17100A;
      min-height: 100vh;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      color: #F2E4C6;
      -webkit-font-smoothing: antialiased;
    }
    .glow-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
      background: linear-gradient(160deg, #241609 0%, #17100A 55%, #0D0906 100%); }
    .glow-bg span { position: absolute; border-radius: 50%; filter: blur(90px); }
    .glow-1 {
      width: 60vmax; height: 60vmax; top: -22vmax; right: -20vmax;
      background: radial-gradient(circle, rgba(205, 159, 78, 0.22), transparent 70%);
    }
    .glow-2 {
      width: 50vmax; height: 50vmax; bottom: -20vmax; left: -18vmax;
      background: radial-gradient(circle, rgba(205, 159, 78, 0.14), transparent 70%);
    }
    .lang-select {
      position: relative; z-index: 1;
      width: 100%; max-width: 380px;
      padding: 32px; text-align: center;
      border: 1px solid rgba(205, 159, 78, 0.4);
      border-radius: 6px;
    }
    .lang-select__title { margin: 0 0 40px; }
    .lang-select__title-ar {
      display: block; font-family: 'Cairo', sans-serif;
      font-size: 1.6rem; font-weight: 800; margin-bottom: 8px;
      color: #F1D998;
    }
    .lang-select__title-en {
      display: block; font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem; font-weight: 600; color: #B79E74; letter-spacing: 0.04em;
    }
    .lang-options { display: flex; flex-direction: column; gap: 14px; }
    .lang-option {
      display: block; padding: 18px; border-radius: 12px;
      background: rgba(40, 26, 14, 0.7);
      border: 1px solid rgba(205, 159, 78, 0.35);
      color: #F2E4C6; text-decoration: none;
      font-size: 1.1rem; font-weight: 600;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .lang-option:hover {
      background: rgba(205, 159, 78, 0.12);
      border-color: #CD9F4E;
    }
    .lang-option[lang="ar"] { font-family: 'Cairo', sans-serif; }
    .lang-option[lang="en"] { font-family: 'Cormorant Garamond', serif; }
  </style>
</head>
<body>

  <div class="glow-bg" aria-hidden="true">
    <span class="glow-1"></span>
    <span class="glow-2"></span>
  </div>

  <main class="lang-select">
    <h1 class="lang-select__title">
      <span class="lang-select__title-ar" lang="ar" dir="rtl">اختر لغتك</span>
      <span class="lang-select__title-en" lang="en" dir="ltr">Choose Your Language</span>
    </h1>
    <div class="lang-options">
      <a class="lang-option" lang="ar" dir="rtl" href="ar.html">العربية</a>
      <a class="lang-option" lang="en" dir="ltr" href="en.html">English</a>
    </div>
  </main>

</body>
</html>
