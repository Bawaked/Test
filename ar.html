<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17100A">
  <title>بطاقة أعمال رقمية</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="glow-bg" aria-hidden="true">
    <span class="glow-1"></span>
    <span class="glow-2"></span>
    <span class="glow-3"></span>
  </div>

  <div class="frame" aria-hidden="true">
    <span class="frame-corner frame-corner--tl"></span>
    <span class="frame-corner frame-corner--tr"></span>
    <span class="frame-corner frame-corner--bl"></span>
    <span class="frame-corner frame-corner--br"></span>
  </div>

  <main class="card">
    <div class="card__top">
      <div class="card__intro">
        <h1 class="name">
          <span class="name__first" id="firstName"></span>
          <span class="name__last" id="lastName"></span>
        </h1>
        <p class="job-title" id="jobTitle"></p>
        <span class="divider" aria-hidden="true"></span>
      </div>
      <div class="avatar-wrapper">
        <img src="images/profile.jpg" alt="">
      </div>
    </div>

    <div class="card__actions">

    <ul class="social-list" id="socialList" aria-label="روابط التواصل"></ul>

    <nav class="lang-switch">
      <a href="en.html" id="langSwitchLink">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <span id="langSwitchLabel">English</span>
      </a>
    </nav>
    </div>
  </main>

  <div class="copy-toast" id="copyToast"></div>

  <script src="config.js"></script>
  <script src="js/render.js"></script>
</body>
</html>
