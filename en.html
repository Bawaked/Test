<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yaser Bawaked</title>
  <meta name="description" content="Digital Business Card">
  <link rel="icon" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/favicon.png">
  <meta name="theme-color" content="#09090B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="card-page-body">

  <div class="aurora-bg" aria-hidden="true">
    <div class="bg-image-layer"></div>
    <div class="bg-gradient-layer"></div>
    <div class="bg-pattern-layer"></div>
    <div class="bg-texture-layer"></div>
    <div class="motion-fx-layer" id="motionFxLayer"></div>
  </div>

  <div class="card-fx-front" id="cardFxFront" aria-hidden="true"></div>

  <main class="card">
    <span class="fx-conic-ring-card" id="cardConicRing" aria-hidden="true"></span>

    <!-- 1: Profile image -->
    <div class="profile-image-wrapper">
      <span class="fx-conic-ring" id="profileConicRing" aria-hidden="true"></span>
      <img
        src="images/profile.jpg"
        alt=""
        class="profile-image"
        width="640"
        height="640"
      >
    </div>

    <!-- 2: Full name -->
    <h1 class="name"></h1>

    <!-- 3: Job title -->
    <p class="job-title"></p>

    <!-- 4: Add to Contacts button -->
    <a
      href="vcard/contact.vcf"
      type="text/vcard"
      class="btn btn--primary btn--add-contact"
    >
      <img src="icons/contact.svg" alt="" class="btn__icon" aria-hidden="true">
      <span></span>
    </a>

    <!-- 5: Contact & social cards (Call, WhatsApp, Email, then platforms) -->
    <nav class="contact-cards">

      <a href="#" class="contact-card contact-card--call" data-card="call">
        <img src="icons/phone.svg" alt="" class="contact-card__icon" aria-hidden="true">
        <span class="contact-card__text">
          <span class="contact-card__title"></span>
          <span class="contact-card__desc"></span>
        </span>
        <span class="contact-card__arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a href="#" class="contact-card contact-card--whatsapp" data-card="whatsapp" target="_blank" rel="noopener noreferrer">
        <img src="icons/whatsapp.svg" alt="" class="contact-card__icon" aria-hidden="true">
        <span class="contact-card__text">
          <span class="contact-card__title"></span>
          <span class="contact-card__desc"></span>
        </span>
        <span class="contact-card__arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a href="#" class="contact-card contact-card--email" data-card="email">
        <img src="icons/email.svg" alt="" class="contact-card__icon" aria-hidden="true">
        <span class="contact-card__text">
          <span class="contact-card__title"></span>
          <span class="contact-card__desc"></span>
        </span>
        <span class="contact-card__arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a href="#" class="contact-card contact-card--facebook" data-card="facebook" target="_blank" rel="noopener noreferrer">
        <img src="icons/facebook.svg" alt="" class="contact-card__icon" aria-hidden="true">
        <span class="contact-card__text">
          <span class="contact-card__title"></span>
          <span class="contact-card__desc"></span>
        </span>
        <span class="contact-card__arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a href="#" class="contact-card contact-card--instagram" data-card="instagram" target="_blank" rel="noopener noreferrer">
        <img src="icons/instagram.svg" alt="" class="contact-card__icon" aria-hidden="true">
        <span class="contact-card__text">
          <span class="contact-card__title"></span>
          <span class="contact-card__desc"></span>
        </span>
        <span class="contact-card__arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a href="#" class="contact-card contact-card--tiktok" data-card="tiktok" target="_blank" rel="noopener noreferrer">
        <img src="icons/tiktok.svg" alt="" class="contact-card__icon" aria-hidden="true">
        <span class="contact-card__text">
          <span class="contact-card__title"></span>
          <span class="contact-card__desc"></span>
        </span>
        <span class="contact-card__arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a href="#" class="contact-card contact-card--snapchat" data-card="snapchat" target="_blank" rel="noopener noreferrer">
        <img src="icons/snapchat.svg" alt="" class="contact-card__icon" aria-hidden="true">
        <span class="contact-card__text">
          <span class="contact-card__title"></span>
          <span class="contact-card__desc"></span>
        </span>
        <span class="contact-card__arrow" aria-hidden="true">&rarr;</span>
      </a>

      <a href="#" class="contact-card contact-card--linkedin" data-card="linkedin" target="_blank" rel="noopener noreferrer">
        <img src="icons/linkedin.svg" alt="" class="contact-card__icon" aria-hidden="true">
        <span class="contact-card__text">
          <span class="contact-card__title"></span>
          <span class="contact-card__desc"></span>
        </span>
        <span class="contact-card__arrow" aria-hidden="true">&rarr;</span>
      </a>

    </nav>

    <!-- 6: Language switch button -->
    <footer class="language-switch">
      <a href="ar.html" class="lang-btn"></a>
    </footer>

  </main>

  <script src="config.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ripple.js" defer></script>
  <script src="js/language.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
